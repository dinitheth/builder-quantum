[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  node_bundler = "esbuild"

# Redirect API calls to the correct function
[[redirects]]
  force = true
  from = "/api/megaeth-rpc"
  to = "/.netlify/functions/megaeth-rpc"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
